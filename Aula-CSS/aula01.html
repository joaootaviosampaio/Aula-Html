<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Aula 1</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <h1>CSS - Cascading Style Cheet</h1>
    <div>
        <p class="paragrafo1">Paragrafo1</p>
        <p class="padrao teste">Paragrafo2</p>
        <p class="paragrafo padrao">Paragrafo3</p>
        <p class="vermelho-forte">Paragrafo4</p>
        <p class="vermelho-fraco">Paragrafo5</p>
        <p class="verde-pequeno">Paragrafo6</p>
        <p class="verde-pequeno">Paragrafo7</p>
        <hr/>
        <div>
            <h2>Preencha seus dados</h2>
            <form action="">  <!--O action do formulario é o destinatario, pode ser url e etc-->
                <input type="text" name="Nome" id="" placeholder="Seu nome"><br/><br/>
                <input type="number" name="Idade" placeholder="Sua Idade" min="18"><br/><br/>
                <input type="email" name="Email" placeholder="Seu email"><br/><br/>
                <input type="submit" value="Enviar"><br/><br/>
            </form>
        </div>
    </div>
</body>
</html>
