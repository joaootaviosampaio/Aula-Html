<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forumulario</title>
    <style type="text/css"></style>
</head>
<body> 
    <form action="aula4.html" method="post">
        <div class="form">
            <div>
                <h1>Preencha seus dados</h1>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Nome" autofocus required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" required><br><br>
                <label for="idade">Selecione sua idade</label>
                <input type="number" id=" idade" name="idade" min="0" max="40" required><br><br>
                <input type="submit" value="Enviar"><br><br>
            </div>
        </div>
    </form> 
</body>
</html>
