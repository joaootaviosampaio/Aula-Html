<body>

        <form method="post">
            <p>
            <label for="Nome">Nome</label>
            <input type="text" name="Nome" id="Nome">
            </p>
            <p>
                <label for="Sobrenome">Sobrenome</label>
                <input type="text" name="Sobrenome" id="Sobrenome">
            </p>
                <label for="Senha">Senha</label>
                 <input type="password" name="Senha" id="Senha">
            <p>
                <label>Escolha uma das opções: </label>
                <br/>
                <label for="preto">Preto</label>
                <input type="checkbox" name="preto" id="preto">
                <br/>
                <label for="roxo">Roxo</label>
                <input type="checkbox" name="roxo" id="roxo">
                <br/>
                <label for="azul">Azul</label>
                <input type="checkbox" name="azul" id="azul">
            </p>
            <p>
                <label for="code1">Retirar no balcão</label>
                <input type="radio" name="retirada" id="code1" value="balcao">
                <br/>
                <label for="code2">Retirar no portão</label>
                <input type="radio" name="retirada" id="code2" value="portao">
                <br/>
                <label for="code3">Entrega Personalizada</label>
                <input type="radio" name="retirada" id="code3" value="personalizada">
            </p>
            <p>
                <input type="submit" value="Clique aqui">
            </p>
        </form>


</body>
