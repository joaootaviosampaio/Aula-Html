<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">

        a:link { 
            text-decoration: none;
        }
        a:visited{
            color: #800080;
        }
        a:hover {
            text-decoration: underline;
        }
        a:active {
            background-color: gray;
        }
    </style>
    <title>Links</title>
</head>
<body>
    <div>
        <h1>Links</h1>
        <ul>
            <li><a href="#">Pagina inicial</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
        <ul>
            <li>Link</li>
            <li>Visited</li>
            <li>Hover</li>&nbsp;
            <li>Active</li>
        </ul>
    </div>    
</body>
</html>
