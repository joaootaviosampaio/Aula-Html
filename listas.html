<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">

        ol {
            list-style: upper-roman;
        }

    </style>
    <title>Listas</title>
</head>
<body>
    <div>
        <h1>Listas</h1><br>
        <p>Listas não ordenadas</p>
            <!--Unordened List-->
        <ul>
            <li>Item 1</li>
                <ul>
                    <li>Item 1.1</li>
                    <li>Item 1.2</li>
                </ul>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
        <p>Listas ordenadas</p>
            <!--Ordened List-->
        <ol>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ol>
    </div>
</body>
</html>
